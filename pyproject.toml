[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness-core"
version = "2.0.0"
description = "Decoupled, bare-metal AI agent harness engine for multi-agent routing, context firebreaks, prompt caching, and sandboxed A2A."
authors = [{ name = "Koality-Assured", email = "engineering@koality-assured.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
harness-init = "harness.cli.harness_init:main"

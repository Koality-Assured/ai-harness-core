<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="AI Harness Core Logo">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#151928" />
      <stop offset="60%" stop-color="#0B0E17" />
      <stop offset="100%" stop-color="#05070C" />
    </radialGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#7C3AED" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- High-Tech Linear Gradients -->
    <linearGradient id="cyberBlueViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="violetToCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="80%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="darkArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCore" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Plate Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="url(#cyberBlueViolet)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Ambient Energy Field -->
  <circle cx="256" cy="256" r="210" fill="url(#ambientGlow)" />

  <!-- Tech Grid Background Crosshairs & Radials -->
  <g opacity="0.18">
    <circle cx="256" cy="256" r="230" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="256" cy="256" r="200" fill="none" stroke="#94A3B8" stroke-width="0.75" />
    <line x1="256" y1="36" x2="256" y2="476" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 6" />
    <line x1="36" y1="256" x2="476" y2="256" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 6" />
    <line x1="100" y1="100" x2="412" y2="412" stroke="#818CF8" stroke-width="0.75" stroke-dasharray="2 8" />
    <line x1="100" y1="412" x2="412" y2="100" stroke="#818CF8" stroke-width="0.75" stroke-dasharray="2 8" />
  </g>

  <!-- Outer Orbital Harness Gear Ring -->
  <g id="outer-gear-assembly" filter="url(#dropShadow)">
    <!-- Gear Rim Track -->
    <circle cx="256" cy="256" r="186" fill="none" stroke="url(#darkArmor)" stroke-width="10" />
    <circle cx="256" cy="256" r="186" fill="none" stroke="url(#violetToCyan)" stroke-width="2" stroke-opacity="0.8" />
    
    <!-- Outer Gear Teeth (16 teeth symmetrically positioned) -->
    <g fill="url(#platinumGrad)" stroke="#0F172A" stroke-width="1" opacity="0.85">
      <rect x="251" y="60" width="10" height="14" rx="2" />
      <rect x="251" y="438" width="10" height="14" rx="2" />
      <rect x="60" y="251" width="14" height="10" rx="2" />
      <rect x="438" y="251" width="14" height="10" rx="2" />

      <rect x="251" y="60" width="10" height="14" rx="2" transform="rotate(45 256 256)" />
      <rect x="251" y="438" width="10" height="14" rx="2" transform="rotate(45 256 256)" />
      <rect x="60" y="251" width="14" height="10" rx="2" transform="rotate(45 256 256)" />
      <rect x="438" y="251" width="14" height="10" rx="2" transform="rotate(45 256 256)" />

      <rect x="251" y="60" width="10" height="14" rx="2" transform="rotate(22.5 256 256)" />
      <rect x="251" y="438" width="10" height="14" rx="2" transform="rotate(22.5 256 256)" />
      <rect x="60" y="251" width="14" height="10" rx="2" transform="rotate(22.5 256 256)" />
      <rect x="438" y="251" width="14" height="10" rx="2" transform="rotate(22.5 256 256)" />

      <rect x="251" y="60" width="10" height="14" rx="2" transform="rotate(67.5 256 256)" />
      <rect x="251" y="438" width="10" height="14" rx="2" transform="rotate(67.5 256 256)" />
      <rect x="60" y="251" width="14" height="10" rx="2" transform="rotate(67.5 256 256)" />
      <rect x="438" y="251" width="14" height="10" rx="2" transform="rotate(67.5 256 256)" />
    </g>

    <!-- Calibration Index Marks (32 fine ticks) -->
    <circle cx="256" cy="256" r="176" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 15.26" opacity="0.75" />
    <circle cx="256" cy="256" r="168" fill="none" stroke="#C084FC" stroke-width="0.75" stroke-dasharray="1 7.63" opacity="0.5" />
  </g>

  <!-- 5-Tier Interlocking Context Hierarchy Rings -->
  <g id="context-tiers-assembly">
    <!-- TIER 5: Dynamic Turn Delta (Outer Segmented Ring r=154) -->
    <circle cx="256" cy="256" r="154" fill="none" stroke="url(#cyberBlueViolet)" stroke-width="3.5"
            stroke-dasharray="55 18 35 15 70 20" stroke-linecap="round" opacity="0.9" />
    <circle cx="256" cy="256" r="154" fill="none" stroke="#00F0FF" stroke-width="1"
            stroke-dasharray="15 45" stroke-linecap="round" opacity="0.6" />

    <!-- TIER 4: Ephemeral Turn Context (JIT Injected Arc r=134) -->
    <circle cx="256" cy="256" r="134" fill="none" stroke="#818CF8" stroke-width="3"
            stroke-dasharray="40 14 60 18" stroke-linecap="round" opacity="0.85" />
    <!-- Tier 4 Node Markers -->
    <circle cx="390" cy="256" r="3.5" fill="#38BDF8" filter="url(#subtleGlow)" />
    <circle cx="122" cy="256" r="3.5" fill="#38BDF8" filter="url(#subtleGlow)" />

    <!-- TIER 3: Monotonic Conversation History (Immutable append track r=114) -->
    <circle cx="256" cy="256" r="114" fill="none" stroke="url(#platinumGrad)" stroke-width="3" opacity="0.75" />
    <circle cx="256" cy="256" r="114" fill="none" stroke="#00F0FF" stroke-width="1.5"
            stroke-dasharray="8 12" opacity="0.9" />
    <circle cx="256" cy="142" r="4" fill="#C084FC" filter="url(#subtleGlow)" />
    <circle cx="256" cy="370" r="4" fill="#C084FC" filter="url(#subtleGlow)" />

    <!-- TIER 2: Static Skill Context (Specialist Contract Arc r=94) -->
    <circle cx="256" cy="256" r="94" fill="none" stroke="url(#violetToCyan)" stroke-width="4"
            stroke-dasharray="80 15 80 15" stroke-linecap="round" />
    <circle cx="256" cy="256" r="94" fill="none" stroke="#FFFFFF" stroke-width="1"
            stroke-dasharray="4 8" opacity="0.8" />

    <!-- TIER 1: Static Base Prefix (Immutable Token 0 Foundation r=74) -->
    <circle cx="256" cy="256" r="74" fill="none" stroke="url(#platinumGrad)" stroke-width="5" />
    <circle cx="256" cy="256" r="74" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#subtleGlow)" />
  </g>

  <!-- Quad-Directional Harness Locking Calipers / Clamps -->
  <g id="harness-calipers" filter="url(#dropShadow)">
    <!-- Top Caliper -->
    <g>
      <path d="M 242 76 L 270 76 L 265 140 L 256 150 L 247 140 Z" fill="url(#darkArmor)" stroke="url(#cyberBlueViolet)" stroke-width="1.5" />
      <polygon points="253,88 259,88 256,128" fill="url(#neonCyan)" opacity="0.9" />
      <circle cx="256" cy="84" r="3" fill="#FFFFFF" />
    </g>
    <!-- Bottom Caliper -->
    <g transform="rotate(180 256 256)">
      <path d="M 242 76 L 270 76 L 265 140 L 256 150 L 247 140 Z" fill="url(#darkArmor)" stroke="url(#cyberBlueViolet)" stroke-width="1.5" />
      <polygon points="253,88 259,88 256,128" fill="url(#neonCyan)" opacity="0.9" />
      <circle cx="256" cy="84" r="3" fill="#FFFFFF" />
    </g>
    <!-- Right Caliper -->
    <g transform="rotate(90 256 256)">
      <path d="M 242 76 L 270 76 L 265 140 L 256 150 L 247 140 Z" fill="url(#darkArmor)" stroke="url(#cyberBlueViolet)" stroke-width="1.5" />
      <polygon points="253,88 259,88 256,128" fill="url(#neonCyan)" opacity="0.9" />
      <circle cx="256" cy="84" r="3" fill="#FFFFFF" />
    </g>
    <!-- Left Caliper -->
    <g transform="rotate(270 256 256)">
      <path d="M 242 76 L 270 76 L 265 140 L 256 150 L 247 140 Z" fill="url(#darkArmor)" stroke="url(#cyberBlueViolet)" stroke-width="1.5" />
      <polygon points="253,88 259,88 256,128" fill="url(#neonCyan)" opacity="0.9" />
      <circle cx="256" cy="84" r="3" fill="#FFFFFF" />
    </g>

    <!-- Diagonal Stabilization Brackets (45 deg) -->
    <g transform="rotate(45 256 256)" opacity="0.75">
      <line x1="256" y1="120" x2="256" y2="165" stroke="url(#platinumGrad)" stroke-width="2.5" />
      <circle cx="256" cy="165" r="3" fill="#38BDF8" />
    </g>
    <g transform="rotate(135 256 256)" opacity="0.75">
      <line x1="256" y1="120" x2="256" y2="165" stroke="url(#platinumGrad)" stroke-width="2.5" />
      <circle cx="256" cy="165" r="3" fill="#38BDF8" />
    </g>
    <g transform="rotate(225 256 256)" opacity="0.75">
      <line x1="256" y1="120" x2="256" y2="165" stroke="url(#platinumGrad)" stroke-width="2.5" />
      <circle cx="256" cy="165" r="3" fill="#38BDF8" />
    </g>
    <g transform="rotate(315 256 256)" opacity="0.75">
      <line x1="256" y1="120" x2="256" y2="165" stroke="url(#platinumGrad)" stroke-width="2.5" />
      <circle cx="256" cy="165" r="3" fill="#38BDF8" />
    </g>
  </g>

  <!-- Core Routing Nucleus (Center Router Engine) -->
  <g id="central-routing-core">
    <!-- Outer Octagonal Ring -->
    <polygon points="256,196 298,214 316,256 298,298 256,316 214,298 196,256 214,214"
             fill="#0F172A" stroke="url(#violetToCyan)" stroke-width="3" filter="url(#subtleGlow)" />
    
    <!-- Inner Octagon Facet Matrix -->
    <polygon points="256,206 291,221 306,256 291,291 256,306 221,291 206,256 221,221"
             fill="#1E293B" stroke="url(#platinumGrad)" stroke-width="1.5" />

    <!-- Multi-faceted Prism Shards -->
    <polygon points="256,206 256,256 291,221" fill="#38BDF8" opacity="0.3" />
    <polygon points="291,221 256,256 306,256" fill="#818CF8" opacity="0.4" />
    <polygon points="306,256 256,256 291,291" fill="#C084FC" opacity="0.3" />
    <polygon points="291,291 256,256 256,306" fill="#7C3AED" opacity="0.45" />
    <polygon points="256,306 256,256 221,291" fill="#2563EB" opacity="0.4" />
    <polygon points="221,291 256,256 206,256" fill="#00D2FF" opacity="0.35" />
    <polygon points="206,256 256,256 221,221" fill="#00F0FF" opacity="0.5" />
    <polygon points="221,221 256,256 256,206" fill="#67E8F9" opacity="0.3" />

    <!-- Inner Core Diamond / Glowing Nucleus -->
    <polygon points="256,224 288,256 256,288 224,256"
             fill="#0284C7" stroke="#00F0FF" stroke-width="2" filter="url(#glowCore)" />
    
    <polygon points="256,234 278,256 256,278 234,256"
             fill="#FFFFFF" opacity="0.9" filter="url(#subtleGlow)" />

    <!-- Pure Energy Singularity Dot -->
    <circle cx="256" cy="256" r="6" fill="#FFFFFF" />
  </g>

  <!-- Dynamic Router Vector Nodes & Data Pulses -->
  <g id="data-pulses">
    <!-- Orbiting Packet Nodes -->
    <circle cx="365" cy="180" r="4.5" fill="#00F0FF" filter="url(#subtleGlow)" />
    <circle cx="150" cy="335" r="4.5" fill="#C084FC" filter="url(#subtleGlow)" />
    <circle cx="335" cy="365" r="4" fill="#38BDF8" filter="url(#subtleGlow)" />
    <circle cx="180" cy="150" r="4" fill="#818CF8" filter="url(#subtleGlow)" />

    <!-- Telemetry Marks -->
    <text x="256" y="470" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="11" font-weight="700" fill="#64748B" letter-spacing="4">CORE ORCHESTRATION ENGINE</text>
  </g>
</svg>
